<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<title>Mi Página</title>

    

<h2>Formulario de Registro</h2>

    <form action="/procesar-registro" method="POST">
        <!-- Campo: Nombre -->
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
        </div>
        <br>

        <!-- Campo: Correo -->
        <div>
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
        </div>
        <br>

        <!-- Campo: Contraseña -->
        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Escribe tu contraseña">
        </div>
        <br>

        <!-- Campo: Género -->
        <div>
            <label>Género:</label>
            <input type="radio" id="masculino" name="genero" value="masculino">
            <label for="masculino">Masculino</label>

            <input type="radio" id="femenino" name="genero" value="femenino">
            <label for="femenino">Femenino</label>

            <input type="radio" id="otro" name="genero" value="otro">
            <label for="otro">Otro</label>
        </div>
        <br>

        <!-- Campo: Mensaje -->
        <div>
            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="4" cols="40" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
        <br>

        <!-- Botón de envío -->
        <div>
            <button type="submit">Registrado</button>
        </div>
    </form>

</body>
</html>
